# Valeurs manquantes complétées pour les scénarios de démonstration (config/demo.yaml).
#
# Règle : aucune donnée réelle n'est modifiée. Seules les valeurs « À compléter » des tables
# sont complétées, dans la copie de travail de la démonstration ; une valeur déjà connue n'est
# jamais remplacée (elle est ignorée et signalée). Les productions, surfaces et facteurs connus
# restent ceux des sources.
#
# Statut : « Littérature » quand la valeur est publiée et appliquée telle quelle (source citée) ;
# « Hypothèse » sinon (valeur plausible, ou valeur publiée transposée, source citée si elle
# existe). La note de chaque valeur reçoit la mention « valeur de démonstration ».
# Liste commentée : docs/demo.md.
#
# Résidus complétés : R01 à R06, R08 et R11. R07, R09, R10, R12 et R13 restent bloqués
# (humidité, ratio ou production manquants) : la démonstration ne crée pas de gisement.

# Publications citées, ajoutées au manifeste des sources de la copie de travail seulement.
sources:
  DEMO:
    titre: Valeur de démonstration (scenarios/demo, docs/demo.md)
    url: docs/demo.md
    nature: hypothèse de démonstration
  DEMO-LEGRAS-FMA:
    titre: Legras — la benne à fond mouvant FMA emporte 70 mètres cubes (Réussir)
    url: https://www.reussir.fr/legras-la-benne-fond-mouvant-fma-emporte-70-metres-cubes
    parent: SRC-16
    nature: fiche constructeur (presse agricole)
  DEMO-ADEME-BC-23-5:
    titre: Banque de France — méthodologie fret (facteurs de la Base Carbone ADEME v23.5)
    url: https://www.banque-france.fr/system/files/2026-06/Methodologie_fret.pdf
    parent: SRC-15
    nature: document méthodologique
  DEMO-SPINELLI-2010:
    titre: Spinelli et Picchi (2010), Industrial harvesting of olive tree pruning residue (Bioresource Technology)
    url: https://research.usc.edu.au/esploro/outputs/journalArticle/Industrial-harvesting-of-olive-tree-pruning/99448839902621
    parent: SRC-16
    nature: publication scientifique
  DEMO-JHA-SINGH-2007:
    titre: Physical and Thermal Properties of Untreated and Chemically Treated Rice Husk (AGRIS)
    url: https://agris.fao.org/search/en/records/6474734ebf943c8c798305f1
    parent: SRC-16
    nature: publication scientifique
  DEMO-CMBIOMASS:
    titre: CM Biomass — Olive Cake (Olive Pomace), fiche produit
    url: https://cmbiomass.com/products/olive-cake
    parent: SRC-16
    nature: fiche fournisseur

# Paramètres techniques à compléter (config/parametres.yaml), réglés dans la copie de travail.
reglages:
  PAR-61:
    valeur: 300
    note: "chargement et déchargement d'un camion, environ 2 h de chauffeur et d'engin ; aucun devis publié trouvé"
  PAR-32:
    valeur: 70
    statut: Littérature
    source_id: DEMO-LEGRAS-FMA
    annee: 2024
    note: "semi-remorque à fond mouvant Legras FMA, version 70 m³ (gamme 52, 62 et 70 m³)"
  PAR-62:
    valeur: trois phases
    note: "procédé de trituration retenu pour la démonstration (R05)"

