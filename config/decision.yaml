# Décision multicritère et mélange (sections 9, 10, 11.2.4, lot 5) : réglages de src/decision/
# et src/melange/. Aucune constante métier dans le code (ENF-08).

parametres:
  methode: PAR-40 # somme_ponderee ou topsis
  concentration: PAR-41 # loi de Dirichlet
  seuil_robustesse: PAR-42 # % de tirages classé 1er
  seuil_correlation: PAR-43 # |r| de Pearson
  cr_maximal: PAR-44 # ratio de cohérence AHP
  tirages: PAR-03
  graine: PAR-04
  capacite: PAR-01
  prix_plafond: PAR-34
  prix_biochar: PAR-55
  prix_credit: PAR-56
  part_maximale: PAR-51 # % de K
  cendres_maximales: PAR-52 # % MS
  humidite_maximale: PAR-53 # %
  lambda_carbone: PAR-54 # DH/t CO₂e
  sites: PAR-57 # imposés et exclus
  rayon_e1: PAR-36 # km

# Méthodes de classement disponibles (PAR-40) et leur libellé.
methodes:
  somme_ponderee: Somme pondérée (WSM)
  topsis: TOPSIS

# Analyse « un poids à la fois » (section 10.4) : variation de −50 % à +50 % par pas de 10 %.
sensibilite:
  variation_min: -0.5
  variation_max: 0.5
  pas: 0.1
# Préconditions du classement (section 11.2.3) : au moins 2 sites non exclus et 2 critères.
minimum_sites: 2
minimum_criteres: 2
# Conversion des fractions en pourcentage (critères A3, D2).
pourcentage: 100
# Rang des trois premiers (RG-12 : trio de tête de WSM et de TOPSIS).
rang_tete: 3

# Indice de cohérence aléatoire de Saaty (RI) selon la taille de la matrice (SRC-16-SAATY).
indice_aleatoire:
  1: 0.0
  2: 0.0
  3: 0.58
  4: 0.90
  5: 1.12
  6: 1.24
  7: 1.32
  8: 1.41
  9: 1.45
  10: 1.49
source_indice_aleatoire: SRC-16-SAATY

# Indicateurs spatiaux des sites (critères E1, F1, F2), préparés par scripts.prepare.
spatial:
  routes:
    couche_osm: lines
    valeurs: [motorway, trunk, primary] # autoroutes et routes nationales
    sortie: routes_principales.gpkg
  zones:
    couche_osm: multipolygons
    valeurs: [industrial] # landuse=industrial (zones industrielles et d'activités)
    sortie: zones_activite.gpkg
  crs_metrique: "EPSG:32629" # UTM 29N, distances en mètres sur le Maroc
  metres_par_km: 1000

# Population rurale (G1) : lignes « (milieu rural) » du RGPH 2024 (SRC-09).
population:
  source: SRC-09
  fichier: rgph2024_population_legale.xlsx
  motif_rural: "(milieu rural)"
  colonne_population: Population
  annee: 2024
  sortie: population_rurale.parquet

# Mois du calendrier de disponibilité (critère A4, saisonnalité).
mois: [m01, m02, m03, m04, m05, m06, m07, m08, m09, m10, m11, m12]

# Historique des classements (RG-16 : variation de rang après un changement de paramètre).
dossier_cache: decision
